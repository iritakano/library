<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="addBookBtn">+ Add New Book</button>
    <div class="library"></div>
    <dialog>
        <form action="#">
            <div class="close-container"><button class="close-btn" autofocus>X</button></div>

            <label for="title">Title: </label>
            <input type="text" id="title" name="title" placeholder="Title" required>

            <label for="author">Author: </label>
            <input type="text" id="author" name="author" placeholder="Author" required>

            <label for="pages">Number of Pages:  </label>
            <input type="number" id="pages" name="pages" placeholder="Number of Pages" required>

            <div class="radio-btns">
                <input type="radio" id="read" name="readStatus" value="true">
                <label for="read">I have read this book</label>

                <input type="radio" id="not-read" name="readStatus" value="false">
                <label for="not-read">I have not read this book</label>
            </div>

            <button type="submit" class="submit-btn">Add Book</button>
        </form>
    </dialog>

    <script src="script.js"></script>
    
</body>
</html>
